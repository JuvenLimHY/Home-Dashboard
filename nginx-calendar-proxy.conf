# Calendar feed proxy for Momentum Pro
# ---------------------------------------------------------------------------
# Paste these location blocks inside the server { } block that serves your
# dashboard's index.html, then run:  sudo nginx -t && sudo systemctl reload nginx
#
# Why: calendar providers don't allow browsers to read their iCal feeds from
# another website (CORS), so the dashboard asks YOUR server, which fetches the
# feed for it. Only GET is allowed, and only these fixed calendar hosts are
# proxied, so this is not an open proxy.

# Google Calendar  (feed link: https://calendar.google.com/calendar/ical/.../basic.ics)
location /cal-proxy/google/ {
    limit_except GET { deny all; }
    proxy_pass https://calendar.google.com/;
    proxy_set_header Host calendar.google.com;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store";
}

# Outlook / Microsoft 365  (feed link: https://outlook.office365.com/owa/calendar/.../calendar.ics)
location /cal-proxy/outlook365/ {
    limit_except GET { deny all; }
    proxy_pass https://outlook.office365.com/;
    proxy_set_header Host outlook.office365.com;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store";
}

# Outlook.com  (feed link: https://outlook.live.com/owa/calendar/.../calendar.ics)
location /cal-proxy/outlooklive/ {
    limit_except GET { deny all; }
    proxy_pass https://outlook.live.com/;
    proxy_set_header Host outlook.live.com;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store";
}

# iCloud public calendar  (feed link: webcal://p123-caldav.icloud.com/published/2/...)
# NOTE: not tested against a real iCloud feed. The host is built from the p<number> in the link.
location ~ ^/cal-proxy/icloud/(p\d+)/(.*)$ {
    limit_except GET { deny all; }
    resolver 1.1.1.1 valid=300s;
    set $icloud_host $1-caldav.icloud.com;
    proxy_pass https://$icloud_host/$2$is_args$args;
    proxy_set_header Host $icloud_host;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store";
}
